<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>笔录工具箱</title>
<script>
  // 首帧前先根据系统偏好/上次设置确定主题，避免启动闪白。
  try {
    var saved = localStorage.getItem('rtb.theme');
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = (saved === 'dark' || saved === 'light') ? saved : (dark ? 'dark' : 'light');
  } catch (e) {}
</script>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 11.2c0 3.9-3.8 7.1-8.5 7.1-.9 0-1.8-.1-2.6-.3L4.2 20l1.3-3.6C4.1 15.1 3.2 13.2 3.2 11.2c0-3.9 3.8-7.1 8.5-7.1s8.8 3.2 8.8 7.1Z"/>
      <path d="M8.4 10.8h.01M12 10.8h.01M15.6 10.8h.01"/>
    </svg>
  </div>
  <div class="boot-name">笔录工具箱</div>
  <div class="boot-text" id="boot-text">正在准备…</div>
  <div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div>
</div>
<div id="app" class="app" hidden></div>
<div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
